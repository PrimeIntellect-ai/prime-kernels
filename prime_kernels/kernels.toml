# Every kernel in this package, one table per kernel.
#
# The table name is the folder next to this file, holding the kernel's Python surface and
# its C++/CUDA sources under `csrc/`. Paths are relative to that folder.
#
#   description  what the kernel does
#   ops          torch.ops namespace the compiled extension registers into
#   sources      C++/CUDA files to compile into prime_kernels.<name>._C
#   arch         compute capabilities to compile for; matched exactly against the device
#   cxx-std      C++ standard
#
# Python-only kernels use `python-only = true`, may list import checks in `requires`,
# and omit `ops`, `sources`, and compilation settings.

[flash_moe]
description = "Fused MoE forward (bf16 + mxfp8) on Blackwell tcgen05"
ops = "prime_moe"
sources = [
    "csrc/torch_interface.cpp",
    "csrc/kernels/fused_moe_bf16_kernel.cu",
    "csrc/kernels/fused_moe_mxfp8_kernel.cu",
]
include-dirs = ["csrc/kernels"]
arch = ["10.0a", "10.3a"]
cxx-std = 20

[mxfp8_moe]
description = "MXFP8 grouped GEMM and expert-parallel transport"
python-only = true
requires = ["torchao"]
arch = ["10.0", "10.3"]

[indexed_attention]
description = "Training forward and backward for token-indexed grouped-query attention"
python-only = true
requires = ["tilelang"]
arch = ["8.0", "9.0", "10.0", "10.3"]

[dsa_indexer_topk]
description = "DeepSeek-V4.1 Lightning Indexer forward fused with top-k and two-level candidate blocks"
python-only = true
requires = ["triton"]
arch = ["9.0"]

[moe_experts]
description = "Expert MLP of a rank's local experts (grouped GEMMs + fused clamped SwiGLU), forward and backward, on Hopper; bf16, or blockwise FP8 through DeepGEMM"
python-only = true
requires = ["triton.experimental.gluon"]
arch = ["9.0"]

[mhc_projection]
description = "DeepSeek-V4.1 mHC projection (RMS + gate logits + stream collapse) and gate activations, forward and backward"
python-only = true
requires = ["triton"]
arch = ["9.0"]

[dsa_sparse_attn_bwd]
description = "DeepSeek-V4.1 sparse attention backward (shared K = V latent, per-query slot lists, attention sink) on Hopper"
python-only = true
requires = ["cutlass", "triton"]
arch = ["9.0"]

[fp8_dual_cast]
description = "Per-token and transposed per-token e4m3 casts of a bf16 matrix in one pass (optional DeepSeek-V4 inverse RoPE) on Hopper"
python-only = true
requires = ["cutlass"]
arch = ["9.0"]

