# Every kernel in this package, one table per kernel.
#
# The table name is the folder next to this file, holding the kernel's Python surface and
# its C++/CUDA sources under `csrc/`. Paths are relative to that folder.
#
#   description  what the kernel does
#   ops          torch.ops namespace the compiled extension registers into
#   sources      C++/CUDA files to compile into prime_kernels.<name>._C
#   arch         compute capabilities to compile for; matched exactly against the device
#   cxx-std      C++ standard
#   build-requires  Python distributions needed only to build this kernel
#
# Vendored Python kernels use `python-only = true`, may list import checks in `requires`,
# and omit `ops`, `sources`, and compilation settings.

[flash_moe]
description = "Fused MoE forward (bf16 + mxfp8) on Blackwell tcgen05"
ops = "prime_moe"
sources = [
    "csrc/torch_interface.cpp",
    "csrc/kernels/fused_moe_bf16_kernel.cu",
    "csrc/kernels/fused_moe_mxfp8_kernel.cu",
]
include-dirs = ["csrc/kernels"]
arch = ["10.0a"]
cxx-std = 20

[mxfp8_moe]
description = "MXFP8 grouped GEMM and expert-parallel transport"
python-only = true
requires = ["torchao"]
arch = ["10.0"]

[nvfp4_moe]
description = "Per-token NVFP4 grouped GEMM with BF16 backward"
build-requires = ["nvidia-cutlass==4.2.0.0"]
ops = "prime_rl"
sources = [
    "csrc/torch_interface.cpp",
    "csrc/quantize/bindings.cpp",
    "csrc/quantize/quantize.cu",
    "csrc/grouped_gemm/bindings.cpp",
    "csrc/grouped_gemm/f4f4bf16_ultra_grouped.cu",
    "csrc/grouped_gemm/f4f4bf16_ultra_grouped_256_128_256_2_1_1.cu",
    "csrc/grouped_gemm/f4f4bf16_ultra_grouped_256_256_256_2_1_1.cu",
]
include-dirs = ["csrc/grouped_gemm"]
include-packages = { cutlass_library = ["source/include", "source/tools/util/include"] }
arch = ["10.0a"]
cxx-std = 17
cxx-flags = ["-O3"]
nvcc-flags = ["-O3", "--expt-relaxed-constexpr", "--expt-extended-lambda", "--threads=2"]

